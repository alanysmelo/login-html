<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="container">
        <div class="imagem">
            <h2>Bem-vindo de volta!</h2>
            <p>Por favor, faça login para continuar.</p>
        </div>


        <form action="processar_formulario.php" method="post">

            <div class="form-control">
                <label for="login">login:</label>
                <input type="text" id="login" placeholder="Digite seu login" required><br><br>
            </div>

            <div class="form-control">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required><br><br>
            </div>

            <div class="form-control">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required><br><br>
            </div>                                 

            <button type="submit">Enviar</button>

            <br>

            <a href="recuperar-senha.html" class="cadastro">Esqueceu a senha ? Clique aqui!</a>

        </form>

    </div>
</body>

</html>
