<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk-Mi | Recuperar Senha</title>
    <link rel="stylesheet" href="recuperar-senha.css">
</head>

<body>

    <div class="container">
        <div class="imagem">
            <h2>Ops, esqueceu a senha?</h2>
            <p>Não se preocupe! Vamos te ajudar a entrar de outra forma.</p>
        </div>

        <div class="formulario">
            <a href="login.html" class="voltar">← Voltar para o login</a>
            <h1>Recuperar senha</h1>
            <p class="descricao">
                Digite seu e-mail cadastrado e enviaremos as instruções para você criar uma nova senha.
            </p>

            <form action="#" method="post">
                <label for="email">Seu e-mail</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                <button type="submit">Recuperar minha senha</button>
            </form>

            <p class="ajuda">Precisa de ajuda? Entre em contato conosco!</p>
        </div>
    </div>

</body>

</html>
